<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basanite Copilot</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="app" class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-title">Basanite Copilot</span>
      </div>
      <div class="header-actions">
        <button id="minimize-btn" class="icon-btn" title="Minimise" aria-label="Minimise">−</button>
        <button id="close-btn" class="icon-btn" title="Close overlay" aria-label="Close overlay">×</button>
      </div>
    </header>
    <main id="content" class="content">
      <p class="empty-state">No active interview. Open the Basanite live panel to start.</p>
    </main>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
